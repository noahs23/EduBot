<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>EduBot — Display</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0a0a0c;--surface:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);
    --text:#f0f0f0;--muted:#6a6a78;--lime:#b5f542;--lime-glow:rgba(181,245,66,.2);
    --cyan:#3ef0e8;--red:#ff4444}
  body{font-family:Impact,'Arial Black',sans-serif;background:#000;color:var(--text);
    width:100vw;height:100dvh;overflow:hidden;position:relative}
  .grid-bg{position:fixed;inset:0;pointer-events:none;
    background:linear-gradient(rgba(181,245,66,.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(181,245,66,.02) 1px,transparent 1px);background-size:50px 50px}
  .corner-deco{position:fixed;width:50px;height:50px;z-index:50;pointer-events:none;opacity:.12}
  .corner-deco.tl{top:16px;left:16px;border-top:2px solid var(--lime);border-left:2px solid var(--lime)}
  .corner-deco.tr{top:16px;right:16px;border-top:2px solid var(--lime);border-right:2px solid var(--lime)}
  .corner-deco.bl{bottom:16px;left:16px;border-bottom:2px solid var(--lime);border-left:2px solid var(--lime)}
  .corner-deco.br{bottom:16px;right:16px;border-bottom:2px solid var(--lime);border-right:2px solid var(--lime)}
  .video-container{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000}
  .video-container video{width:100%;height:100%;object-fit:contain;background:#000}
  .idle-screen{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1rem;transition:opacity .5s}
  .idle-screen.hidden{opacity:0;pointer-events:none}
  .idle-robot svg{width:120px;height:120px;filter:drop-shadow(0 0 20px var(--lime-glow));animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .idle-title{font-size:3rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;text-align:center}
  .idle-title .accent{color:var(--lime)}
  .idle-status{font-family:'Courier New',monospace;font-size:.85rem;color:var(--muted);
    letter-spacing:.15em;text-transform:uppercase;display:flex;align-items:center;gap:.5rem}
  .idle-status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .idle-status.connected .dot{background:var(--lime);box-shadow:0 0 8px var(--lime-glow);animation:blink 1.2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .idle-cp{font-family:'Courier New',monospace;font-size:.75rem;color:var(--cyan);letter-spacing:.1em}
  .tap-hint{font-family:'Courier New',monospace;font-size:.6rem;color:var(--muted);
    letter-spacing:.08em;margin-top:1rem;opacity:.5}
  .now-playing{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;
    gap:.6rem;padding:.5rem 1rem;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent);
    opacity:1;transition:opacity .5s;pointer-events:none}
  .now-playing.hidden{opacity:0}
  .np-dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink .8s infinite;flex-shrink:0}
  .np-text{font-family:'Courier New',monospace;font-size:.7rem;color:var(--text);
    letter-spacing:.1em;text-transform:uppercase;opacity:.8}
  .progress-bar{position:fixed;bottom:0;left:0;right:0;height:4px;z-index:40;background:rgba(255,255,255,.05)}
  .progress-bar.hidden{display:none}
  .progress-fill{height:100%;background:var(--lime);box-shadow:0 0 10px var(--lime-glow);width:0%;transition:width .3s linear}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="corner-deco tl"></div><div class="corner-deco tr"></div>
<div class="corner-deco bl"></div><div class="corner-deco br"></div>

<div id="idleScreen" class="idle-screen">
  <div class="idle-robot">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="16" y="24" width="32" height="28" rx="4" fill="#1a1a22" stroke="#b5f542" stroke-width="2"/>
      <rect x="22" y="32" width="8" height="6" rx="2" fill="#3ef0e8"/>
      <rect x="34" y="32" width="8" height="6" rx="2" fill="#3ef0e8"/>
      <rect x="26" y="44" width="12" height="3" rx="1.5" fill="#6a6a78"/>
      <line x1="32" y1="14" x2="32" y2="24" stroke="#b5f542" stroke-width="2"/>
      <circle cx="32" cy="12" r="3" fill="#b5f542"/>
      <rect x="8" y="34" width="8" height="4" rx="2" fill="#6a6a78"/>
      <rect x="48" y="34" width="8" height="4" rx="2" fill="#6a6a78"/>
      <rect x="20" y="52" width="8" height="6" rx="2" fill="#6a6a78"/>
      <rect x="36" y="52" width="8" height="6" rx="2" fill="#6a6a78"/>
    </svg>
  </div>
  <div class="idle-title">EDU<span class="accent">BOT</span></div>
  <div id="idleStatus" class="idle-status"><span class="dot"></span><span id="idleStatusText">Connecting...</span></div>
  <div id="idleCp" class="idle-cp"></div>
  <div class="tap-hint">Tap screen once to enable video playback</div>
</div>

<div id="videoContainer" class="video-container" style="display:none">
  <video id="videoPlayer" playsinline></video>
</div>
<div id="nowPlaying" class="now-playing hidden">
  <div class="np-dot"></div><span id="npText" class="np-text"></span>
</div>
<div class="progress-bar hidden" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>

<script>
const idleScreen=document.getElementById('idleScreen');
const idleStatus=document.getElementById('idleStatus');
const idleStatusText=document.getElementById('idleStatusText');
const idleCp=document.getElementById('idleCp');
const videoContainer=document.getElementById('videoContainer');
const videoPlayer=document.getElementById('videoPlayer');
const nowPlaying=document.getElementById('nowPlaying');
const npText=document.getElementById('npText');
const progressBar=document.getElementById('progressBar');
const progressFill=document.getElementById('progressFill');

let videoUrls={};
let isPlaying=false;
let videoQueue=[];
let tapped=false;

document.body.addEventListener('click',function(){tapped=true;},{ once:true });

async function loadVideos(){
  try{const r=await fetch('/api/videos');const d=await r.json();videoUrls=d.videos||{};}catch(e){}}

function playVideo(checkpoint){
  const src=videoUrls[checkpoint];
  if(!src){showIdle(checkpoint);return;}
  if(isPlaying){videoQueue.push(checkpoint);return;}
  isPlaying=true;
  idleScreen.classList.add('hidden');
  videoContainer.style.display='flex';
  nowPlaying.classList.remove('hidden');
  npText.textContent='Playing: '+checkpoint;
  progressBar.classList.remove('hidden');
  videoPlayer.src=src;
  videoPlayer.currentTime=0;
  const p=videoPlayer.play();
  if(p)p.catch(function(){
    videoContainer.addEventListener('click',function h(){videoPlayer.play();videoContainer.removeEventListener('click',h);});
  });
}

videoPlayer.addEventListener('timeupdate',function(){
  if(videoPlayer.duration){progressFill.style.width=(videoPlayer.currentTime/videoPlayer.duration*100)+'%';}
});

videoPlayer.addEventListener('ended',function(){
  isPlaying=false;
  videoContainer.style.display='none';
  nowPlaying.classList.add('hidden');
  progressBar.classList.add('hidden');
  progressFill.style.width='0%';
  if(videoQueue.length>0){setTimeout(function(){playVideo(videoQueue.shift());},500);}
  else{idleScreen.classList.remove('hidden');}
});

function showIdle(cp){
  idleScreen.classList.remove('hidden');
  videoContainer.style.display='none';
  idleCp.textContent=cp&&cp!=='HOME'?'Location: '+cp:'';
}

function connectSSE(){
  const es=new EventSource('/api/events');
  es.onmessage=function(e){
    try{
      const d=JSON.parse(e.data);
      if(d.type==='connected'){
        idleStatus.classList.add('connected');
        idleStatusText.textContent='Connected — Waiting';
        loadVideos();
      }
      if(d.type==='arrived'){
        idleStatus.classList.add('connected');
        idleStatusText.textContent='At '+d.checkpoint;
        loadVideos().then(function(){
          if(d.checkpoint==='HOME')showIdle('HOME');
          else playVideo(d.checkpoint);
        });
      }
    }catch(err){}
  };
  es.onerror=function(){
    idleStatus.classList.remove('connected');
    idleStatusText.textContent='Reconnecting...';
    es.close();
    setTimeout(connectSSE,3000);
  };
}

loadVideos();
connectSSE();
</script>
</body>
</html>
